<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>IPSC Logo Vote · Admin</title><link rel="stylesheet" href="style.css"></head><body><header><div class="eyebrow">ORGANIZER ACCESS</div><h1>Voting results</h1><p>Private dashboard · 2027 IPSC Nationals</p></header><main class="adminwrap"><section id="login" class="panel"><h2>Sign in</h2><p>Enter your organizer email and password.</p><form id="loginForm"><input id="email" type="email" placeholder="organizer@example.com" autocomplete="username" required><input id="password" type="password" placeholder="Password" autocomplete="current-password" required><p><button type="submit">Sign in</button></p></form><p id="loginMsg" role="status"></p></section><section id="dashboard" class="hidden"><div class="actions"><button id="refresh">Refresh results</button><button id="export" class="secondary">Export CSV</button><button id="signout" class="secondary">Sign out</button></div><section class="panel"><h2 id="total">Votes</h2><div id="stats"></div></section><section class="panel"><h2>Voter notes</h2><div id="notesList"></div></section></section></main><script src="config.js"></script><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const c=window.VOTE_CONFIG, db=createClient(c.supabaseUrl,c.supabaseAnonKey), login=document.getElementById('login'),dashboard=document.getElementById('dashboard');let rows=[];
const labels={'moose-crest':'Moose Crest','moose-modern':'Modern Moose','lighthouse':'Lighthouse','raccoon':'Raccoon Mascot','action':'Action Shooters','moose-silver':'Silver Moose Crest'};
const safe=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
async function show(){const {data:{session}}=await db.auth.getSession();if(!session){login.classList.remove('hidden');dashboard.classList.add('hidden');return}login.classList.add('hidden');dashboard.classList.remove('hidden');await refresh()}
async function refresh(){const {data,error}=await db.from('votes').select('logo_id,voter_name,notes,created_at').order('created_at',{ascending:false}).limit(10000);if(error){document.getElementById('stats').textContent='Access denied or data unavailable. Confirm your email is listed in the admins table.';document.getElementById('notesList').textContent=error.message;return}rows=data||[];document.getElementById('total').textContent=`${rows.length} total votes`;
document.getElementById('stats').innerHTML=Object.entries(labels).map(([id,name])=>{const n=rows.filter(r=>r.logo_id===id).length,p=rows.length?Math.round(n*100/rows.length):0;return `<div class="stat"><div class="stathead"><strong>${name}</strong><span>${n} votes · ${p}%</span></div><div class="bar"><div class="fill" style="width:${p}%"></div></div></div>`}).join('');
document.getElementById('notesList').innerHTML=rows.filter(r=>r.notes).map(r=>`<div class="note"><small>${safe(r.voter_name)} · ${safe(labels[r.logo_id])} · ${safe(new Date(r.created_at).toLocaleString())}</small>${safe(r.notes)}</div>`).join('')||'<p>No notes yet.</p>'}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {error}=await db.auth.signInWithPassword({email,password});document.getElementById('loginMsg').textContent=error?error.message:'Signed in.';if(!error)await show()});
document.getElementById('refresh').onclick=refresh;document.getElementById('signout').onclick=async()=>{await db.auth.signOut();show()};
document.getElementById('export').onclick=()=>{const csv=[['name','logo','notes','date'],...rows.map(r=>[r.voter_name,labels[r.logo_id],r.notes||'',r.created_at])].map(a=>a.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ipsc-2027-logo-votes.csv';a.click();URL.revokeObjectURL(a.href)};
db.auth.onAuthStateChange(()=>setTimeout(show,0));show();

</script></body></html>
