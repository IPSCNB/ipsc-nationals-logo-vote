<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>IPSC Logo Vote · Admin</title><link rel="stylesheet" href="style.css"></head><body><header><div class="eyebrow">ORGANIZER ACCESS</div><h1>Voting results</h1><p>Private dashboard · 2027 IPSC Nationals</p></header><main class="adminwrap"><section id="login" class="panel"><h2>Sign in</h2><p>Enter your organizer email and password.</p><form id="loginForm"><input id="email" type="email" placeholder="organizer@example.com" autocomplete="username" required><input id="password" type="password" placeholder="Password" autocomplete="current-password" required><p><button type="submit">Sign in</button></p></form><p id="loginMsg" role="status"></p></section><section id="dashboard" class="hidden"><div class="actions"><button id="refresh">Refresh results</button><button id="export" class="secondary">Export CSV</button><button id="signout" class="secondary">Sign out</button></div><section class="panel"><h2 id="total">Votes</h2><div id="stats"></div></section><section class="panel"><h2>Voter notes</h2><div id="notesList"></div></section></section></main><script src="config.js"></script><script type="module" src="admin.js"></script></body></html>
